name: Node unit tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  agency-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Verify agency flow in browser
        run: |
          node server.js > /tmp/agency-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:3000/api/health && break
            sleep 1
          done
          node scripts/agency-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agency-browser-evidence
          path: |
            /tmp/agency-home.png
            /tmp/agency-studio.png
            /tmp/agency-export.png
            /tmp/agency-export-video.*
            /tmp/agency-server.log
